<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Payment Form — create payments, view history, and track statistics">
    <title>Payment Form — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Decorative background orbs -->
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="navbar__brand">
            <svg class="navbar__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
            <span class="navbar__title">PaymentForm</span>
        </div>
        <div class="navbar__tabs">
            <a href="#create" class="navbar__tab active" data-page="create" id="nav-create">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Create Payment
            </a>
            <a href="#history" class="navbar__tab" data-page="history" id="nav-history">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                History
            </a>
            <a href="#stats" class="navbar__tab" data-page="stats" id="nav-stats">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                Statistics
            </a>
        </div>
    </nav>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Main content -->
    <main class="main-content" id="app">
        <!-- Pages rendered here by JS -->
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/pages/create-payment.js"></script>
    <script src="/js/pages/payment-history.js"></script>
    <script src="/js/pages/statistics.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
